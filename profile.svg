<svg xmlns="http://www.w3.org/2000/svg" width="840" height="340" viewBox="0 0 840 340" fill="none">
  <defs>
    <!-- Animated Gradient Border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff">
        <animate attributeName="stop-color" values="#58a6ff;#bc8cff;#3fb950;#58a6ff" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#bc8cff">
        <animate attributeName="stop-color" values="#bc8cff;#3fb950;#58a6ff;#bc8cff" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#3fb950">
        <animate attributeName="stop-color" values="#3fb950;#58a6ff;#bc8cff;#3fb950" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="bgGrad" x1="0" y1="0" x2="840" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <!-- Typing Clip Path -->
    <clipPath id="typingClip">
      <rect x="36" y="72" width="0" height="30">
        <animate attributeName="width" values="0;375;375;0;0" keyTimes="0;0.35;0.85;0.95;1" dur="9s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <style>
    .title { font: 700 28px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f0f6fc; }
    .subtitle { font: 500 16px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill: #58a6ff; }
    .section-label { font: 600 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; letter-spacing: 0.8px; text-transform: uppercase; }
    .pill-text { font: 600 12px 'SFMono-Regular', Consolas, monospace; fill: #c9d1d9; }
    .stat-val { font: 700 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f0f6fc; }
    .stat-lbl { font: 400 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; }
    .status-text { font: 500 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #3fb950; }

    @keyframes pulseRing {
      0% { transform: scale(0.85); opacity: 0.9; }
      70% { transform: scale(1.9); opacity: 0; }
      100% { transform: scale(1.9); opacity: 0; }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .pulse-ring {
      transform-origin: 655px 38px;
      animation: pulseRing 2.2s infinite ease-out;
    }
    .cursor {
      animation: blink 0.9s infinite;
    }
  </style>

  <!-- Main Card Background & Animated Border -->
  <rect x="1.5" y="1.5" width="837" height="337" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Header & Status Pulse -->
  <text x="36" y="52" class="title">Parvin Aslanov</text>
  
  <rect x="638" y="24" width="166" height="28" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1" />
  <circle cx="655" cy="38" r="5" fill="#3fb950" class="pulse-ring" />
  <circle cx="655" cy="38" r="4.5" fill="#3fb950" />
  <text x="668" y="42" class="status-text">Building with AI & Code</text>

  <!-- Typing Subtitle -->
  <g clip-path="url(#typingClip)">
    <text x="36" y="92" class="subtitle">> Software Engineer | Holberton School</text>
  </g>
  <rect x="36" y="76" width="2" height="20" fill="#58a6ff" class="cursor">
    <animate attributeName="x" values="36;408;408;36;36" keyTimes="0;0.35;0.85;0.95;1" dur="9s" repeatCount="indefinite" />
  </rect>

  <!-- Divider -->
  <line x1="36" y1="116" x2="804" y2="116" stroke="#21262d" stroke-width="1.5" />

  <!-- Left Column: Tech Stack -->
  <text x="36" y="144" class="section-label">Core Stack & Tools</text>

  <g transform="translate(36, 158)">
    <rect x="0" y="0" width="82" height="28" rx="6" fill="#161b22" stroke="#30363d" />
    <circle cx="14" cy="14" r="4" fill="#3572A5" />
    <text x="25" y="18" class="pill-text">Python</text>

    <rect x="92" y="0" width="104" height="28" rx="6" fill="#161b22" stroke="#30363d" />
    <circle cx="106" cy="14" r="4" fill="#f1e05a" />
    <text x="117" y="18" class="pill-text">JavaScript</text>

    <rect x="206" y="0" width="68" height="28" rx="6" fill="#161b22" stroke="#30363d" />
    <circle cx="220" cy="14" r="4" fill="#f34b7d" />
    <text x="231" y="18" class="pill-text">C++</text>

    <rect x="284" y="0" width="74" height="28" rx="6" fill="#161b22" stroke="#30363d" />
    <circle cx="298" cy="14" r="4" fill="#b07219" />
    <text x="309" y="18" class="pill-text">Java</text>

    <rect x="0" y="38" width="118" height="28" rx="6" fill="#161b22" stroke="#30363d" />
    <circle cx="14" cy="52" r="4" fill="#bc8cff" />
    <text x="25" y="56" class="pill-text">AI Workflows</text>

    <rect x="128" y="38" width="110" height="28" rx="6" fill="#161b22" stroke="#30363d" />
    <circle cx="142" cy="52" r="4" fill="#3fb950" />
    <text x="153" y="56" class="pill-text">Linux / Git</text>

    <rect x="248" y="38" width="110" height="28" rx="6" fill="#161b22" stroke="#30363d" />
    <circle cx="262" cy="52" r="4" fill="#58a6ff" />
    <text x="273" y="56" class="pill-text">Sys Design</text>
  </g>

  <!-- Right Column: Profile & Education Card -->
  <text x="450" y="144" class="section-label">Engineering Focus</text>

  <rect x="450" y="158" width="354" height="130" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1" />

  <text x="470" y="186" class="stat-val">Holberton School</text>
  <text x="470" y="204" class="stat-lbl">Software Engineering & AI Development</text>

  <line x1="470" y1="218" x2="784" y2="218" stroke="#21262d" stroke-width="1" />

  <text x="470" y="244" class="stat-val">IT STEP Academy</text>
  <text x="470" y="262" class="stat-lbl">Computer Science & Software Foundations</text>

  <!-- Footer Note -->
  <text x="36" y="310" class="stat-lbl">github.com/parvinaslanov  •  Clean architecture, debugging & AI-assisted engineering</text>
</svg>
